<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR & VR dengan A-Frame</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Tombol Switch Mode -->
    <button onclick="switchMode('ar')" style="position: fixed; top: 10px; left: 10px; z-index: 10;">Mode AR</button>
    <button onclick="switchMode('vr')" style="position: fixed; top: 10px; left: 100px; z-index: 10;">Mode VR</button>

    <!-- Mode AR -->
    <a-scene embedded arjs id="arScene">
        <a-marker preset="hiro">
            <a-image src="img/aja.jpeg" position="0 0 0"
                     animation="property: rotation; to: 0 360 0; loop: true; dur:2000">
            </a-image>
        </a-marker>

        <a-marker preset="kanji">
            <a-image src="img/kucing.jpeg" position="0 0 0"
                     animation="property: rotation; to: 0 360 0; loop: true; dur:2000">
            </a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Mode VR (Disembunyikan Saat AR Aktif) -->
    <a-scene id="vrScene" style="display: none;">
        <a-sky src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg"></a-sky>
        <a-box position="0 1 -3" color="red" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>
        <a-camera position="0 1.6 0">
            <a-cursor></a-cursor>
        </a-camera>
    </a-scene>

    <script>
        function switchMode(mode) {
            if (mode === 'ar') {
                document.getElementById('arScene').style.display = 'block';
                document.getElementById('vrScene').style.display = 'none';
            } else {
                document.getElementById('arScene').style.display = 'none';
                document.getElementById('vrScene').style.display = 'block';
            }
        }
    </script>

</body>
</html>
